[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onepo"
version = "0.1.0"
description = "OnePO: SFT-free one-stage policy optimization on verl"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "verl @ git+https://github.com/verl-project/verl.git@bf48903d93e4618531d3bbae96551a889007dd8b",
  "aiohttp>=3.9",
  "datasets>=3.0",
  "hydra-core>=1.3",
  "numpy>=1.24",
  "requests>=2.31",
  "torch>=2.6",
  "transformers>=4.51",
]

[tool.setuptools.packages.find]
include = ["onepo*"]

[tool.ruff]
line-length = 120
target-version = "py310"
